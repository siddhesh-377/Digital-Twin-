<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time Spacecraft Digital Twin Platform — Simulate spacecraft operations, astronaut activities, and emergency scenarios for mission planning, testing, and crew training.">
  <title>Spacecraft Digital Twin — Mission Control Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Three.js (r150 — last version with examples/js global scripts) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/emergency.css">
  <link rel="stylesheet" href="css/spacecraft-viewer.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
  <!-- Star Field Background Canvas -->
  <canvas id="star-canvas" class="stars-container"></canvas>

  <!-- Scan-line CRT Overlay -->
  <div class="scan-overlay"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  MAIN APPLICATION LAYOUT                                    -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div class="app-container">

    <!-- ── Sidebar Navigation ──────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <!-- Logo -->
      <div class="sidebar-logo">
        <div class="logo-icon">
          <span class="logo-rocket">🚀</span>
        </div>
        <span class="logo-text text-display">SDT</span>
        <span class="logo-subtitle">Digital Twin</span>
      </div>

      <!-- Navigation Items -->
      <nav class="sidebar-nav">
        <button class="sidebar-nav-item active" data-view="mission-control" title="Mission Control">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
          </span>
          <span class="nav-label">Mission Control</span>
        </button>

        <button class="sidebar-nav-item" data-view="astronaut" title="Astronaut Dashboard">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span class="nav-label">Astronaut</span>
        </button>

        <button class="sidebar-nav-item" data-view="spacecraft" title="3D Spacecraft Viewer">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </span>
          <span class="nav-label">Spacecraft</span>
        </button>

        <button class="sidebar-nav-item" data-view="emergency" title="Emergency Scenarios">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </span>
          <span class="nav-label">Emergency</span>
        </button>

        <button class="sidebar-nav-item" data-view="training" title="Training Module">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </span>
          <span class="nav-label">Training</span>
        </button>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="sidebar-sim-indicator">
          <span class="status-dot nominal" id="sim-status-dot"></span>
          <span class="nav-label text-label">SIMULATION ACTIVE</span>
        </div>
      </div>
    </aside>

    <!-- ── Main Content Area ───────────────────────────────────── -->
    <main class="main-content">
      <!-- Status Bar -->
      <header class="status-bar">
        <div class="status-bar-left">
          <span class="status-bar-view-title text-display" id="current-view-title">Mission Control</span>
        </div>
        <div class="status-bar-center">
          <div class="clock-group">
            <div class="clock-item">
              <span class="clock-label text-label">MET</span>
              <span class="clock-value text-mono" id="clock-met">045:14:00:00</span>
            </div>
            <div class="clock-divider"></div>
            <div class="clock-item">
              <span class="clock-label text-label">UTC</span>
              <span class="clock-value text-mono" id="clock-utc">2026-08-07 11:10:00 UTC</span>
            </div>
          </div>
        </div>
        <div class="status-bar-right">
          <div class="sim-controls">
            <button class="sim-btn" id="btn-pause-sim" title="Pause Simulation">
              <span class="btn-icon">⏸</span>
            </button>
            <button class="sim-btn" id="btn-reset-sim" title="Reset Simulation">
              <span class="btn-icon">↺</span>
            </button>
            <div class="speed-control">
              <span class="text-label">SPEED</span>
              <input type="range" id="sim-speed-slider" min="0" max="6" value="3" class="speed-slider">
              <span class="text-mono speed-value" id="sim-speed-display">1x</span>
            </div>
          </div>
        </div>
      </header>

      <!-- View Container -->
      <div class="view-container">
        <!-- Mission Control View -->
        <div class="view-panel active" id="panel-mission-control">
          <div id="view-mission-control"></div>
        </div>

        <!-- Astronaut Dashboard View -->
        <div class="view-panel" id="panel-astronaut">
          <div id="view-astronaut"></div>
        </div>

        <!-- 3D Spacecraft Viewer -->
        <div class="view-panel" id="panel-spacecraft">
          <div class="viewer-container" id="viewer-canvas-container">
            <div class="viewer-loading" id="viewer-loading">
              <div class="spinner"></div>
              <span class="text-display">Initializing Digital Twin...</span>
            </div>
            <!-- HUD Overlay -->
            <div class="viewer-hud" id="viewer-hud" style="display:none;">
              <div class="hud-top-bar">
                <div class="hud-info-panel">
                  <div class="hud-metric">
                    <span class="hud-metric-label">ALTITUDE</span>
                    <span class="hud-metric-value text-mono" id="hud-altitude">408.2 km</span>
                  </div>
                  <div class="hud-metric">
                    <span class="hud-metric-label">VELOCITY</span>
                    <span class="hud-metric-value text-mono" id="hud-velocity">7.66 km/s</span>
                  </div>
                  <div class="hud-metric">
                    <span class="hud-metric-label">ATTITUDE</span>
                    <span class="hud-metric-value text-mono" id="hud-attitude">P:0.0 Y:0.0 R:0.0</span>
                  </div>
                </div>
              </div>
              <div class="hud-crosshair"></div>
              <div class="hud-bottom-bar">
                <div class="view-mode-group">
                  <button class="view-mode-btn active" data-mode="realistic">🎨 Realistic</button>
                  <button class="view-mode-btn" data-mode="wireframe">🔲 Wireframe</button>
                  <button class="view-mode-btn" data-mode="heatmap">🌡️ Heatmap</button>
                  <button class="view-mode-btn" data-mode="xray">👁️ X-Ray</button>
                </div>
                <div class="camera-preset-group">
                  <button class="camera-preset-btn" data-preset="front" title="Front">F</button>
                  <button class="camera-preset-btn" data-preset="back" title="Back">B</button>
                  <button class="camera-preset-btn" data-preset="top" title="Top">T</button>
                  <button class="camera-preset-btn" data-preset="side" title="Side">S</button>
                  <button class="camera-preset-btn" data-preset="iso" title="Isometric">I</button>
                  <button class="camera-preset-btn" data-preset="orbit" title="Orbit">O</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Emergency Scenarios View -->
        <div class="view-panel" id="panel-emergency">
          <div id="view-emergency"></div>
        </div>

        <!-- Training Module View -->
        <div class="view-panel" id="panel-training">
          <div id="view-training"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  JAVASCRIPT MODULES (order matters — dependencies first)    -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <script src="js/utils.js"></script>
  <script src="js/telemetry-simulator.js"></script>
  <script src="js/mission-control.js"></script>
  <script src="js/astronaut-dashboard.js"></script>
  <script src="js/emergency-panel.js"></script>
  <script src="js/spacecraft-viewer.js"></script>
  <script src="js/training-module.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
